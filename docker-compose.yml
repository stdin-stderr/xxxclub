x-xxxclub-image: &xxxclub-image
  image: xxxclub:local
  build:
    context: .
  env_file:
    - path: .env
      required: false

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xxxclub
      POSTGRES_PASSWORD: xxxclub
      POSTGRES_DB: xxxclub
    ports:
      - "5432:5432"
    volumes:
      - xxxclub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xxxclub"]
      interval: 5s
      timeout: 5s
      retries: 10

  scraper:
    <<: *xxxclub-image
    restart: unless-stopped
    command: ["scraper"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

  web:
    <<: *xxxclub-image
    restart: unless-stopped
    command: ["web"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./db.py:/app/db.py
      - ./webapp.py:/app/webapp.py
      - ./web:/app/web
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

  tpdb-matcher:
    <<: *xxxclub-image
    restart: unless-stopped
    command: ["tpdb-matcher"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # THEPORNDB_API_KEY=yourkeyhere
      THEPORNDB_API_KEY: ${THEPORNDB_API_KEY:-}

volumes:
  xxxclub_pgdata:
